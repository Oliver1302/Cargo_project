<svg viewBox="0 0 622 470" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Background -->
  <rect width="622" height="470" fill="none"/>
  
  <!-- Trucks illustration -->
  <g id="trucks">
    <!-- Left truck -->
    <g id="left-truck">
      <rect x="185" y="320" width="100" height="60" fill="#0066CC" rx="5"/>
      <circle cx="215" cy="385" r="12" fill="#333"/>
      <circle cx="265" cy="385" r="12" fill="#333"/>
      <polygon points="210,320 240,280 240,320" fill="#0066CC"/>
    </g>
    
    <!-- Center cargo box -->
    <g id="cargo">
      <rect x="290" y="290" width="80" height="90" fill="#0066CC" rx="8"/>
      <line x1="310" y1="290" x2="310" y2="380" stroke="#666" stroke-width="2"/>
      <line x1="330" y1="290" x2="330" y2="380" stroke="#666" stroke-width="2"/>
      <line x1="350" y1="290" x2="350" y2="380" stroke="#666" stroke-width="2"/>
    </g>
    
    <!-- Right truck -->
    <g id="right-truck">
      <rect x="375" y="320" width="100" height="60" fill="#0066CC" rx="5"/>
      <circle cx="405" cy="385" r="12" fill="#333"/>
      <circle cx="455" cy="385" r="12" fill="#333"/>
      <polygon points="412,320 442,280 442,320" fill="#0066CC"/>
    </g>
  </g>
  
  <!-- Text -->
  <text x="311" y="430" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#0066CC">GENERAL</text>
  <text x="311" y="465" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#333" letter-spacing="4">LOGISTICS</text>
</svg>
